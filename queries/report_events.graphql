# One page of events.
#
# The `data` field is JSON, so event shape is preserved verbatim rather than
# forced into a fixed selection set -- exactly what a research dataset needs
# (brief section 13: do not force every event into a lossy schema).
#
# `sourceID` / `targetID` restrict a stream to one actor. This is what makes a
# focus-player corpus affordable: full telemetry for the player being studied,
# cheap party context for everyone else. A stream narrowed this way is NOT the
# same stream -- `run_stream_coverage` records the filter so nothing downstream
# can read a filtered stream as a complete one.
#
# `nextPageTimestamp` is the pagination cursor. Whether it is inclusive is
# determined empirically by `wclmplus recon`; see src/wcl_mplus/paginate.py,
# which is correct either way.
query ReportEvents(
  $code: String!
  $startTime: Float!
  $endTime: Float!
  $dataType: EventDataType
  $hostilityType: HostilityType
  $limit: Int
  $fightIDs: [Int]
  $sourceID: Int
  $targetID: Int
) {
  reportData {
    report(code: $code) {
      events(
        startTime: $startTime
        endTime: $endTime
        dataType: $dataType
        hostilityType: $hostilityType
        limit: $limit
        fightIDs: $fightIDs
        sourceID: $sourceID
        targetID: $targetID
        includeResources: true
        translate: true
      ) {
        data
        nextPageTimestamp
      }
    }
  }
}
