[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-mplus"
version = "0.1.1"
description = "Warcraft Logs Mythic+ research dataset collector (Midnight Season 2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Analytical export formats. Not needed for Phase 0 recon.
export = ["pyarrow>=15.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
wclmplus = "wcl_mplus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wcl_mplus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-API tests are opt-in only: `pytest -m live` after exporting credentials.
markers = ["live: requires real Warcraft Logs credentials and network access"]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument/Option in a default is the framework's documented idiom.
"src/wcl_mplus/cli.py" = ["B008"]
# The simulator is mostly wide response literals; wrapping them hurts more
# than it helps when comparing them against real API shapes.
"tests/wcl_simulator.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
