# ---------------------------------------------------------------------------
# Sampling profiles — how runs are chosen, and which events are downloaded.
# Editable without touching Python (brief sections 15, 44).
# ---------------------------------------------------------------------------

# Key-level strata. NOT hardcoded in source; change freely.
key_brackets:
  # The first pilot collected two +6 runs, which fell outside every bracket and
  # so out of every per-bracket comparison. Keys start at 2, so this bracket
  # closes the bottom rather than leaving low keys silently unclassified.
  - { key: "2-6",   min: 2,  max: 6 }
  - { key: "7-8",   min: 7,  max: 8 }
  # 9 was missing from this list until the first pilot put runs in no bracket at
  # all. A gap here does not lose a run -- it lands in "outside brackets" and the
  # validation report names the key levels -- but it silently drops it from every
  # per-bracket comparison, which is worse than an ugly bracket.
  - { key: "9",     min: 9,  max: 9 }
  - { key: "10",    min: 10, max: 10 }
  - { key: "11-12", min: 11, max: 12 }
  - { key: "13-14", min: 13, max: 14 }
  - { key: "15+",   min: 15, max: null }

# ---------------------------------------------------------------------------
# Event collection profiles.
#
# `event_types` values are NOT yet validated against the live EventDataType
# enum. `wclmplus recon` records the real enum, and `wclmplus config-check`
# fails if a profile names a type the live schema does not accept.
# ---------------------------------------------------------------------------
event_profiles:
  metadata:
    description: "No events at all. Report, fight, pulls, pull NPCs, roster, master data."
    event_types: []

  mechanics:
    description: "Default research profile: what a tank/healer experiences."
    # An entry may carry a hostility filter as "Type@Hostility".
    #
    # This is not an optimisation. A live sample of unfiltered Casts returned
    # 50 events from five PLAYERS and not one NPC -- players simply out-cast
    # the trash in raw event count, and players are not instanced, so the
    # sample carried no sourceInstance at all. Filtering to Enemies returned 11
    # distinct NPCs with 36 of 50 events carrying the instance marker.
    # Splitting the two is what makes NPC cast timelines visible.
    event_types:
      - Casts@Enemies        # the mechanics themselves
      - Casts@Friendlies     # player defensives, interrupt attempts, dispels
      - Debuffs
      # Buffs was 71.7% of a 3.5M-event corpus, unfiltered -- the same shape as
      # the unfiltered Casts problem above, where players drowned the NPCs.
      # Split so the two can be measured, and dropped, independently.
      - Buffs@Enemies        # enrages, empowerments, shields the party must answer
      - Buffs@Friendlies     # player defensives and procs; the expensive half
      - Interrupts
      - Dispels
      - Deaths
      - Summons
      - DamageTaken          # player-side incoming damage: the danger signal
    include_combatant_info: true

  mechanics-lean:
    description: "REDUCED FIDELITY. mechanics minus player buffs. Storage escape hatch only."
    # This profile discards data on purpose, which is the one thing this project
    # otherwise refuses to do. Reach for it only when storage genuinely forbids
    # the full profile, and never mix it with `mechanics` in one database: the
    # runs collected under it hold no player buff rows, and nothing in those
    # runs distinguishes "not collected" from "did not happen". The validation
    # report detects the mix and says so, but detection after the fact is worse
    # than not creating it.
    # Measured on 66 runs: Buffs@Friendlies is ~70% of all events and ~60% of
    # all pages. Dropping it takes a run from roughly 23 MB to roughly 7 MB.
    # What is lost is player proc and defensive *aura* timing; DamageTaken still
    # carries the auras active at each hit, so "what was up when it landed"
    # survives. What is kept is every NPC mechanic, unchanged.
    event_types:
      - Casts@Enemies
      - Casts@Friendlies
      - Debuffs
      - Buffs@Enemies
      - Interrupts
      - Dispels
      - Deaths
      - Summons
      - DamageTaken
    include_combatant_info: true

  full:
    description: "Adds healing and full damage. Larger; justify before large samples."
    event_types:
      - Casts@Enemies
      - Casts@Friendlies
      - Debuffs
      - Buffs@Enemies
      - Buffs@Friendlies
      - Interrupts
      - Dispels
      - Deaths
      - Summons
      - DamageTaken
      - DamageDone
      - Healing
      - Resources
    include_combatant_info: true

  # -------------------------------------------------------------------------
  # Purpose-built profiles. The collector is a selectable instrument: the right
  # streams depend on the question, and one universal maximum-fidelity profile
  # is both unaffordable at corpus scale and insufficient for coaching.
  #
  # NONE of these is the default yet. Their costs are unmeasured -- see
  # `wclmplus benchmark`. Do not promote one to the large-corpus default until
  # the measurements are reviewed.
  # -------------------------------------------------------------------------

  mechanics_research:
    description: "Large corpus. What did the dungeon and its mobs do?"
    # Environment and party context at full fidelity; no per-player rotational
    # telemetry. Deliberately omits DamageDone, Healing and friendly Buffs,
    # which answer questions about players rather than about the dungeon.
    event_types:
      - Casts@Enemies
      - Buffs@Enemies
      # Resources@Enemies was here on the hope that NPC energy mechanics would
      # show up. MEASURED: zero events across 10 fights, every probe exhausted.
      # NPC energy is not exposed through this stream, so paying a request per
      # run for a guaranteed empty answer buys nothing. Removed, not disabled --
      # if a future dungeon suggests otherwise, benchmark it again rather than
      # carrying a dead stream.
      - Summons
      - Debuffs
      - DamageTaken
      - Casts@Friendlies     # defensives, interrupts, dispels -- not full rotation
      - Interrupts
      - Dispels
      - Deaths
    include_combatant_info: true

  reference_player:
    description: "Behavioural reference corpus: full telemetry for one player, context for the rest."
    # The layering that makes a large reference corpus affordable. Everything in
    # event_types is collected for the whole party; everything in
    # focus_event_types is narrowed to the focus player's actor ID and is only
    # requested when --focus-player resolves in that run.
    event_types:
      - Casts@Enemies
      - Buffs@Enemies
      - Summons
      - Debuffs
      - DamageTaken
      - Interrupts
      - Dispels
      - Deaths
      # Healing party-wide, not focus-only. MEASURED at 29,083 events/run --
      # cheaper than the Buffs@Friendlies this project already collects (38,628)
      # and about a third of DamageDone. Party-wide is what section 22 needs:
      # a healer's low output may be the other four players taking avoidable
      # damage, and focus-only data cannot tell those apart.
      - Healing@Friendlies
      - Healing@Enemies
      # DamageDone party-wide, not focus-only. Storage was one of two reasons to
      # narrow it and is no longer a constraint; the remaining cost is time,
      # since it roughly doubles points per run. Collecting one player of five
      # would mean every question about any other player in a stored run needs
      # that run fetched again -- and the point of the corpus is that it can be
      # asked questions nobody has thought of yet.
      - DamageDone@Friendlies
      - DamageDone@Enemies
    focus_event_types:
      # Every one explicitly @Friendlies. An unfiltered request returns the
      # friendly side anyway -- measured for DamageDone, Healing, Threat, and
      # previously for Casts and Buffs -- but relying on that default hides the
      # assumption in the API's behaviour instead of stating it here.
      - Casts@Friendlies
      - Buffs@Friendlies
      - Resources@Friendlies
    include_combatant_info: true

  user_coaching:
    description: "One user's own run, analysed in depth. Storage is not the constraint here."
    # A user may ask a new question after the report has been analysed, and
    # re-fetching is the only way to answer it. Asymmetry favours keeping
    # everything, for every party member, on the handful of runs this touches.
    event_types:
      - Casts@Enemies
      - Casts@Friendlies
      - Buffs@Enemies
      - Buffs@Friendlies
      - Debuffs
      - DamageTaken
      - DamageDone@Friendlies
      - DamageDone@Enemies
      - Healing@Friendlies
      - Healing@Enemies
      - Resources@Friendlies
      # Resources@Enemies omitted: measured empty across every probed fight.
      - Interrupts
      - Dispels
      - Summons
      - Deaths
      # Threat@Enemies, not Threat: unfiltered returns the friendly side only,
      # and the enemy side is ~5x larger. MEASURED: this stream carries NO
      # threat value -- no field in it names threat at all. It returns the casts
      # and deaths that generate threat, flagged melee/fake/feign. It cannot
      # answer "who had aggro"; it can show what was swung and when.
      - Threat@Enemies
      - Threat@Friendlies
    include_combatant_info: true

  forensic_full:
    description: "Everything the API exposes. Small samples only -- never a 5,000-run corpus."
    # For discovering undocumented relationships, validating analysis, building
    # fixtures, and answering "does this stream carry a field we need?".
    event_types: [All]
    include_combatant_info: true

  raw-all:
    description: "Every event. Validation samples only until cost is measured."
    event_types: [All]
    include_combatant_info: true

# ---------------------------------------------------------------------------
# Sample profiles.
# ---------------------------------------------------------------------------
sample_profiles:
  pilot:
    description: "Phase 1. 5-10 runs, one dungeon, trust-building."
    event_profile: mechanics
    runs_per_bracket: 2
    max_runs_total: 10
    brackets: ["7-8", "10", "13-14"]
    require_timed: false          # untimed runs are research-relevant, not noise
    deduplicate: true
    restrict_to_current_hotfix_epoch: false

  research:
    description: "Phase 2. 50-100+ runs across brackets."
    event_profile: mechanics
    runs_per_bracket: 20
    max_runs_total: 120
    brackets: ["7-8", "10", "11-12", "13-14", "15+"]
    require_timed: false
    deduplicate: true
    restrict_to_current_hotfix_epoch: true

  validation:
    description: "Tiny raw-all sample used to prove event semantics."
    event_profile: raw-all
    runs_per_bracket: 1
    max_runs_total: 2
    brackets: ["10"]
    require_timed: false
    deduplicate: false
    restrict_to_current_hotfix_epoch: false

# ---------------------------------------------------------------------------
# Politeness. Conservative by default; raise only after measuring real cost.
# ---------------------------------------------------------------------------
api:
  concurrency: 2
  min_points_reserve: 200        # stop scheduling when hourly points left < this
  max_retries: 5
  timeout_seconds: 60
  events_page_limit: 10000       # UNVERIFIED ceiling; recon probes the real max

# ---------------------------------------------------------------------------
# Known bias sources to record alongside every sample (brief section 8).
# These are recorded, not corrected — the analyst reweights later.
# ---------------------------------------------------------------------------
tracked_biases:
  - leaderboard_bias
  - uploader_bias
  - region_bias
  - guild_bias
  - repeated_group_bias
  - composition_bias
  - timed_only_bias
  - hotfix_bias
  - survivorship_bias
