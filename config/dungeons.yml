# ---------------------------------------------------------------------------
# Dungeon registry — Midnight Season 2 Mythic+
# ---------------------------------------------------------------------------
# The eight dungeons below were confirmed from the LIVE Warcraft Logs API on
# 2026-09-12 (zone 55, "Mythic+ Season 2", expansion 7 "Midnight"), and
# independently confirmed by the project owner.
#
# Numeric IDs are still DELIBERATELY UNSET here. They are not hardcoded in
# this project (brief sections 33 and 54); they are written to the generated
# overlay `config/dungeons.discovered.yml` by:
#
#     wclmplus discover-dungeons --write
#
# which is merged over this file at load time. `display_name` uses the exact
# Warcraft Logs spelling, because matching is by that name; common alternative
# spellings go in `aliases`.
#
# THREE OF THESE DUNGEON NAMES ARE REUSED FROM EARLIER SEASONS:
#   Ruby Life Pools      also Dragonflight S1 (zone 32) and S4 (zone 37)
#   Kings' Rest          also Battle for Azeroth (zone 20)
#   Temple of Sethraliss also Battle for Azeroth (zone 20)
# A name alone is therefore not enough to identify a dungeon. `match_zones`
# infers the current season zone from the dungeons that are unique to it, then
# resolves the reused names inside that zone. Pin `wcl_mplus_zone_id` below if
# you ever need to override that inference.
# ---------------------------------------------------------------------------

season:
  id: midnight-s2
  display_name: "Midnight Season 2"
  # Observed live as 55. Left null so the value comes from discovery, not from
  # source. Set it explicitly only to override the inference.
  wcl_mplus_zone_id: null
  expected_dungeon_count: 8
  verified: false
  notes: >-
    Dungeon list confirmed from the live API and by the project owner on
    2026-09-12. Zone and encounter IDs come from `discover-dungeons --write`.

dungeons:
  # --- Validation targets named in the research brief ---
  - key: murder-row
    display_name: "Murder Row"
    aliases: ["murder row", "murderrow", "mr"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: primary-pilot          # Phase 1 + Phase 2 target
    validation_targets:
      - npc: "Shivan Punisher"
        npc_game_id: null
        abilities:
          - name: "Whirlwind"
            ability_game_id: null
            hypothesis: "trash AoE; recurrence and completion rate unknown"
          - name: "Demonic Frenzy"
            ability_game_id: null
            hypothesis: >-
              sub-50% execute-phase behaviour; unverified whether WCL exposes
              enemy health transitions well enough to time the threshold

  - key: ruby-life-pools
    display_name: "Ruby Life Pools"
    aliases: ["ruby life pools", "rlp", "ruby"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: cross-validation       # Phase 3 target
    notes: >-
      Name reused from Dragonflight S1/S4. Resolved to the current season zone
      by two-pass matching; never match this one on name alone.
    validation_targets:
      - npc: "Thunderhead"
        npc_game_id: null
        abilities:
          - name: "Rolling Thunder"
            ability_game_id: null
            hypothesis: >-
              multi-target debuff with a damaging removal. Target count, aura
              representation and dispel-vs-expiry distinction must be observed
              empirically, NOT encoded in the collector.
          - name: "Thunder Jaw"
            ability_game_id: null
            hypothesis: "overlap candidate against Rolling Thunder removals"

  - key: the-blinding-vale
    display_name: "The Blinding Vale"
    aliases: ["the blinding vale", "blinding vale", "tbv"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: boss-timeline-validation
    validation_targets:
      - npc: "Lightwarden Ruia"
        npc_game_id: null
        abilities: []
        hypothesis: >-
          boss phase/timing validation case. External guides describe a highly
          structured late phase; the log must be allowed to disagree with them.

  - key: den-of-nalorakk
    display_name: "Den of Nalorakk"
    aliases: ["den of nalorakk", "nalorakk", "don"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: health-threshold-validation
    validation_targets:
      - npc: "Hoardmonger"
        npc_game_id: null
        abilities: []
        hypothesis: >-
          health-threshold / phase-change validation case, contingent on whether
          enemy resource (health) data is reliably exposed in events.

  # --- The remaining four, confirmed from the live API 2026-09-12 ---
  - key: altar-of-fangs
    display_name: "Altar of Fangs"
    aliases: ["altar of fangs", "aof", "altar"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: season-coverage
    validation_targets: []

  - key: voidscar-arena
    display_name: "Voidscar Arena"
    aliases: ["voidscar arena", "voidscar", "va"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: season-coverage
    validation_targets: []

  - key: temple-of-sethraliss
    display_name: "Temple of Sethraliss"
    aliases: ["temple of sethraliss", "sethraliss", "tos"]
    wcl_zone_id: null
    encounter_ids: []
    verified: false
    role: season-coverage
    notes: >-
      Name reused from Battle for Azeroth (zone 20). Resolved to the current
