# ---------------------------------------------------------------------------
# Dungeon registry — Midnight Season 2 Mythic+
# ---------------------------------------------------------------------------
# IMPORTANT: every numeric ID below is DELIBERATELY UNSET (null / []).
#
# Warcraft Logs zone IDs, encounter IDs and the exact season dungeon list are
# NOT hardcoded from memory in this project (see brief section 33 and 54).
# They are discovered from the live API and written back into this file by:
#
#     wclmplus discover-dungeons --write
#
# That command queries `worldData` for the current Mythic+ zone, lists its
# encounters, and fills in `wcl_zone_id`, `encounter_ids` and `verified: true`.
# Until then, any code path needing an ID must fail loudly rather than guess.
#
# `aliases` are matched case-insensitively by the CLI (`--dungeon "murder row"`),
# so they work before IDs are known.
# ---------------------------------------------------------------------------

season:
  id: midnight-s2
  display_name: "Midnight Season 2"
  # The WCL zone that contains the season's Mythic+ partition. Discovered, not assumed.
  wcl_mplus_zone_id: null
  expected_dungeon_count: 8
  verified: false
  notes: >-
    Season composition is unverified in this repository. Four dungeons are named
    in the research brief; the remaining slots must be filled from the live API
    before any season-wide collection is attempted.

dungeons:
